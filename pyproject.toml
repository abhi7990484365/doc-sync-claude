# Build backend: setuptools (minimal choice; supports `pip install -e .` with a src/ layout).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc_sync"
version = "0.1.0"
description = "Scan a repository and write docs/PROJECT_DOC.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
doc_sync = "doc_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
