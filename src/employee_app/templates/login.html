{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if failed %}
<p class="error" role="alert">Sign in failed. Check your details and try again.</p>
{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p><label for="username">Username</label><br>
     <input type="text" id="username" name="username" autocomplete="username" required maxlength="100"></p>
  <p><label for="password">Password</label><br>
     <input type="password" id="password" name="password" autocomplete="current-password" required></p>
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
